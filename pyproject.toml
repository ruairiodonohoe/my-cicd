[build-system] # https://docs.astral.sh/uv/concepts/build-backend/
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[project] # https://packaging.python.org/en/latest/specifications/pyproject-toml/
name = "my_cicd"
version = "0.0.0"
description = "Test CICD"
readme = "README.md"
authors = [{ name = "Ruairi O'Donohoe", email = "ruairiodonohoe@gmail.com" }]
requires-python = ">=3.13,<4.0"
dependencies = ["flask>=3.1.3"]

[project.urls] # https://packaging.python.org/en/latest/specifications/well-known-project-urls/#well-known-labels
homepage = "https://github.com/ruairiodonohoe/my_cicd"
source = "https://github.com/ruairiodonohoe/my_cicd"
releasenotes = "https://github.com/ruairiodonohoe/my_cicd/releases"
documentation = "https://ruairiodonohoe.github.io/my_cicd"
issues = "https://github.com/ruairiodonohoe/my_cicd/issues"

[dependency-groups] # https://docs.astral.sh/uv/concepts/projects/dependencies/#development-dependencies
dev = [
  "codespell>=2.4.3",
  "coverage[toml] (>=7.16.0)",
  "ipykernel (>=7.3.0)",
  "ipython (>=9.17.0)",
  "ipywidgets (>=8.1.9)",
  "mkdocs-material (>=9.7.7)",
  "poethepoet>=0.48.0",
  "pre-commit>=4.6.2",
  "pytest (>=9.1.1)",
  "pytest-mock (>=3.15.1)",
  "pytest-xdist (>=3.8.0)",
  "ruff (>=0.16.5)",
  "ty>=0.0.75",
  "typeguard (>=4.6.0)",
]

[tool.codespell] # https://github.com/codespell-project/codespell
builtin = "en-GB_to_en-US,clear,code,rare"
check-filenames = true
skip = "./*_cache/,./.venv,./reports,htmlcov"

[tool.coverage.report] # https://coverage.readthedocs.io/en/latest/config.html#report
fail_under = 80
precision = 1
show_missing = true
skip_covered = true

[tool.coverage.run] # https://coverage.readthedocs.io/en/latest/config.html#run
branch = true
command_line = "--module pytest"
data_file = "reports/.coverage"
source = ["src"]

[tool.coverage.xml] # https://coverage.readthedocs.io/en/latest/config.html#xml
output = "reports/coverage.xml"

[tool.pytest.ini_options] # https://docs.pytest.org/en/latest/reference/reference.html#ini-options-ref
addopts = "--color=yes --doctest-modules --exitfirst --failed-first --strict-config --strict-markers --verbosity=2 --junitxml=reports/pytest.xml"
filterwarnings = ["error", "ignore::DeprecationWarning"]
testpaths = ["src", "tests"]
xfail_strict = true

[tool.ruff] # https://docs.astral.sh/ruff/settings/
fix = true
line-length = 100
src = ["src", "tests"]
target-version = "py313"

[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "CPY",
  "FIX",
  "ARG001",
  "COM812",
  "D203",
  "D213",
  "E501",
  "PD008",
  "PD009",
  "RET504",
  "S101",
  "TD003",
]
unfixable = ["ERA001", "F401", "F841", "T201", "T203"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.pycodestyle]
max-doc-length = 100

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ty.rules]
unused-ignore-comment = "warn"

[tool.ty.terminal]
error-on-warning = true

[tool.poe.executor] # https://github.com/nat-n/poethepoet
type = "simple"

[tool.poe.tasks]

[tool.poe.tasks.docs]
help = "Build or serve the documentation"
shell = """
    if [ $serve ]
    then {
      mkdocs serve
    } else {
      mkdocs build
    } fi
    """

[[tool.poe.tasks.docs.args]]
help = "Serve the documentation locally with live reload"
type = "boolean"
name = "serve"
options = ["--serve"]

[tool.poe.tasks.serve]
help = "Serve the app"

[[tool.poe.tasks.serve.sequence]]
cmd = "flask --app src/my_cicd/app.py run --host=0.0.0.0 --port=5000"

[tool.poe.tasks.lint]
help = "Lint this app"
cmd = """
    pre-commit run
      --all-files
      --color always
    """

[tool.poe.tasks.test]
help = "Test this app"

[[tool.poe.tasks.test.sequence]]
cmd = "coverage run"

[[tool.poe.tasks.test.sequence]]
cmd = "coverage report"

[[tool.poe.tasks.test.sequence]]
cmd = "coverage xml"
